name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: EAS preview build platform
        type: choice
        options: [android, ios, all]
        default: android

jobs:
  check:
    name: Lint · typecheck · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  preview-build:
    name: EAS preview build (manual)
    needs: check
    # Manual only (Actions › CI › Run workflow): every build spends EAS credit, and iOS needs the
    # credentials Angelo creates with the first interactive `eas build -p ios`.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # Preview channel. Requires EXPO_TOKEN in the repo secrets (TR-19).
      - run: eas build --profile preview --platform ${{ inputs.platform }} --non-interactive --no-wait
