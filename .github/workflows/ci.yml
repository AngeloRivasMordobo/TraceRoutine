name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Lint · typecheck · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  preview-build:
    name: EAS preview build (main only)
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # Preview channel, both platforms. Requires EXPO_TOKEN in the repo secrets (TR-19).
      - run: eas build --profile preview --platform all --non-interactive --no-wait
